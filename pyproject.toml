[project]
name = "analyte"
version = "0.1.0"
description = "Bazimi determinist dhe verifikimi i automatizuar i shpjegimeve mjekesore"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
# Vizatimi i korpusit sintetik. Backend-i nuk varet prej tyre: shërbimi
# nuk shtyp kurrë PDF, ai vetëm i lexon.
generate = ["reportlab>=4.0", "pymupdf>=1.24", "pillow>=10.0", "numpy>=1.26"]

[tool.pytest.ini_options]
pythonpath = ["backend/src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
