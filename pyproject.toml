[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "analyte"
version = "0.1.0"
description = "Bazimi determinist dhe verifikimi i automatizuar i shpjegimeve mjekesore"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
# Vizatimi i korpusit sintetik. Backend-i nuk varet prej tyre: shërbimi
# nuk shtyp kurrë PDF, ai vetëm i lexon.
generate = ["reportlab>=4.0", "pymupdf>=1.24", "pillow>=10.0", "numpy>=1.26"]
# Rruga e OCR-së. Motori Tesseract vetë instalohet jashtë Python-it; rruga e
# tij dhe e të dhënave të gjuhës lexohen nga ANALYTE_TESSERACT/ANALYTE_TESSDATA.
ocr = ["pymupdf>=1.24", "pillow>=10.0", "numpy>=1.26"]
# Figurat e punimit, të ndërtuara nga kodi: `python scripts/build_figures.py`.
figures = ["matplotlib>=3.8"]
# Shërbimi: API, baza, radha e punëve. Testet e API-së ekzekutohen mbi
# SQLite dhe punë të menjëhershme; PostgreSQL dhe Redis nevojiten vetëm për
# `make dev` dhe për testin e integrimit.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "arq>=0.26",
    "httpx>=0.27",
    "pymupdf>=1.24",
]

# Depoja ka dy rrënjë kodi: `analyte` nën backend/src dhe mjetet e kërkimit
# (`data_generator`, `evaluation`, `ml`) në rrënjë. Asnjëra s'ka __init__.py,
# prandaj kërkimi bëhet me paketa namespace dhe lista e lejuar është e
# shprehur; pa të setuptools refuzon rrënjën e sheshtë. `resources/`, `data/`,
# `docs/`, `frontend/` dhe `tests/` nuk janë paketa: tabelat burimore lexohen
# në kohë ekzekutimi nga pema e depove (ose nga ANALYTE_RESOURCES), jo nga
# instalimi.
[tool.setuptools.packages.find]
where = ["backend/src", "."]
include = ["analyte*", "data_generator*", "evaluation*", "ml*"]
exclude = ["evaluation.results*", "evaluation.handwritten*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["backend/src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
